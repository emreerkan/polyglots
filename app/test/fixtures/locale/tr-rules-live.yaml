# polyglots rules for tr_TR (tr)
#
# Every section is optional. A section left out keeps the built-in behaviour.
# The built-in values are shown commented out; uncomment a section to change it.
# Any change re-reviews files of this locale from scratch on their next run.
# Check the file with: polyglots rules check tr

# Rules that always run unless disabled: placeholder, html, plural-count, whitespace, untranslated, escaping, line-breaks, punctuation, glossary, inconsistent, tm-conflict, control
rules:
  enable: []
  disable: []

# How much of a glossary term must match an inflected form, between 0 and 1.
glossaryStemRatio: 0.7

# Names capitalized everywhere (always), and only inside a specific date (dateOnly).
properNouns:
  always: []
  dateOnly: []

# Common mistakes: found anywhere in a translation, case-insensitive.
# The AI review weighs each match with your note.
mistakes: []
#  - wrong: önizleme
#    right: ön izleme
#    note: TDK writes it as two words

# Patterns: "text" (a literal) or "find" (a regular expression).
# level: hint (the AI judges), error (always wrong, the AI must fix) or fix (replaced automatically).
# "when: { source: ... }" applies a pattern only when the English source contains that text.
patterns: []
#  - find: '\.\.\.'
#    replace: '…'
#    level: fix
#    note: Use the ellipsis character
#  - find: '(?<![\p{L}\p{M}\p{N}])(?:%(?:\d+\$)?[-+0#]?\d*(?:\.\d+)?[sdfu]|\{[\w-]+\})[''’]\p{L}+'
#    level: hint
#    note: A suffix on a placeholder cannot agree with every value; rephrase so it lands on a word, as in "%s adlı eklentide"
#  - find: '%(?:\d+\$)?[du](?:</[a-z]+>)?\s+(?!(?:dolar|lari|taler|popüler|modüler|seküler|moleküler|selüler|vasküler|regüler|tübüler|angüler|oküler|kapiler|skaler|polar|bipolar|solar|kiler|keler|çalar|galeri|ileri)\p{L}{0,4}(?![\p{L}\p{M}]))\p{L}+(?:lar(?:ı(?:mız|nız)?|ım|ın)?(?:n?a|ya|n?[dt]an?|n?ın|n?ı|y?la|dır|ca|[dt]aki)?|ler(?:i(?:miz|niz)?|im|in)?(?:n?e|ye|n?[dt]en?|n?in|n?i|y?le|dir|ce|[dt]eki)?)(?![\p{L}\p{M}])'
#    level: hint
#    note: Turkish keeps the noun singular after a number, as in "%d dosya"

# Guidance added to the AI review prompts, at most 1500 characters.
# guidance: |
#   Button labels are verbs in the imperative.
